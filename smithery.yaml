startCommand:
  type: http
  configSchema:
    type: object
    properties:
      gatewayUrl:
        type: string
        description: "Fastify Gateway URL for x402 execution endpoints"
        default: "https://api.yourdomain.com"
      chainId:
        type: integer
        description: "EVM Network Chain ID (8453 for Base Mainnet)"
        default: 8453
    required: ["gatewayUrl"]
