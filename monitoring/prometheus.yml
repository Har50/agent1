global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9300"

scrape_configs:
  - job_name: "go-keeper"
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: agentexec-go-keeper

  - job_name: "fastify-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: agentexec-gateway-api
